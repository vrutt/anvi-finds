
[project]
name = "anvi-finds-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "SQLAlchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.2",
    "PyJWT==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "slowapi==0.1.9",
    "email-validator==2.3.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
exclude = ["userauth-venv", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.isort]
profile = "black"
line_length = 120